<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QS Document Intelligence - Pure Frontend</title>
<style>
:root{
  --ink:#14171a; --ink-2:#3d464e; --muted:#6b7681; --faint:#98a2ac;
  --line:#e4e7ea; --line-2:#eef1f3;
  --bg:#fafaf8; --card:#fff; --panel:#f5f6f5;
  --accent:#0d5c58; --accent-2:#0a4a47; --accent-soft:#e8f2f1;
  --warn:#9a5b12; --warn-bg:#fdf5e9; --warn-line:#f0dcc0;
  --bad:#a32f29; --bad-bg:#fceded; --bad-line:#f2cfcd;
  --good:#2c6b39; --good-bg:#eaf3ec; --good-line:#cfe3d3;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
  font-feature-settings:"tnum" 1}
button{font-family:inherit}
a{color:var(--accent);text-decoration:none}

header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.hwrap{max-width:1260px;margin:0 auto;padding:0 28px;height:56px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.spacer{flex:1}
.mode{font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:4px;background:var(--panel);
  color:var(--faint);border:1px solid var(--line);font-weight:500}
.mode.live{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer;
  transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel);border-color:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel);color:var(--ink)}

main{max-width:1260px;margin:0 auto;padding:26px 28px 90px}
h2{font-size:15px;font-weight:600;margin-bottom:3px}
.h2sub{color:var(--muted);font-size:12.5px;margin-bottom:13px}
section{margin-bottom:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}

.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:30px;text-align:center;
  background:var(--card);transition:border-color .15s,background .15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:14px;font-weight:500;margin-bottom:4px}
.drop .small{font-size:12px;color:var(--muted)}

.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:12px 15px;
  font-size:12.5px;color:var(--warn);margin-bottom:14px}
.note.info{background:var(--accent-soft);border-color:#cfe4e2;color:var(--accent)}
.note b{font-weight:600}

.md-content { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
.md-content h3 { font-size: 15px; margin: 16px 0 8px; color: var(--ink); }
.md-content p { margin-bottom: 12px; }
.md-content ul, .md-content ol { margin: 0 0 12px 20px; }
.md-content li { margin-bottom: 4px; }
.md-content table { width: 100%; border-collapse: collapse; margin: 12px 0; }
.md-content th, .md-content td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.md-content th { background: var(--panel); font-weight: 600; }

.overlay{position:fixed;inset:0;background:rgba(20,23,26,.34);display:flex;align-items:flex-start;
  justify-content:center;padding:70px 20px;z-index:200;overflow-y:auto}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:520px;padding:24px 26px;
  box-shadow:0 18px 50px rgba(0,0,0,.18)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;outline:none}
.field input:focus{border-color:var(--accent)}
.modal .foot2{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

.prog{background:var(--panel);border-radius:8px;padding:13px 15px;font-size:12.5px;margin-top:12px}
.prog .bar2{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:9px}
.prog .bar2 i{display:block;height:100%;width:38%;background:var(--accent);border-radius:2px;
  animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}
.prog.err{background:var(--bad-bg);color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo"><span class="dot"></span>QS Document Intelligence</div>
    <div class="spacer"></div>
    <span class="mode live" id="mode">Pure Frontend</span>
    <button class="btn ghost sm" onclick="openSettings()">Settings</button>
  </div>
</header>
<main id="main"></main>
<div id="modal"></div>

<script>
const S = { fileName: null, fileId: null, isAnalyzing: false };

function renderHome() {
  $('#main').innerHTML = `
    <div class="pagehead" style="margin-bottom:20px">
      <h1 style="font-size:22px;font-weight:600">PDF 智能解析</h1>
      <p style="color:var(--muted);font-size:13px;margin-top:3px">上传 PDF，直接交给 AI 提取信息。</p>
    </div>
    <section>
      <div class="drop" id="drop" onclick="pickFiles()">
        <div class="big">点击选择，或将 PDF 拖拽到此处</div>
        <div class="small">支持 PDF（直接通过智谱 AI 解析）</div>
      </div>
      <input type="file" id="picker" hidden onchange="handleFile(this.files[0])">
    </section>
    <section id="fileStatus" style="display:none">
      <h2>当前文件</h2>
      <div class="card" style="padding:16px 18px; display:flex; align-items:center; justify-content:space-between">
        <span id="fileName" style="font-weight:500"></span>
        <button class="btn primary" id="analyzeBtn" onclick="runAnalysis()">开始 AI 分析</button>
      </div>
      <div id="prog"></div>
    </section>
    <section id="resultSection" style="display:none">
      <h2>AI 分析结果</h2>
      <div class="card" style="padding:20px 24px">
        <div class="md-content" id="aiResult"></div>
      </div>
    </section>
  `;
  wireDragDrop();
}

function pickFiles() { $('#picker').click(); }

function handleFile(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.pdf')) {
    alert('目前仅支持 PDF 文件，请上传 PDF。');
    return;
  }
  S.fileName = file.name; S.file = file; S.fileId = null;
  $('#fileName').innerText = file.name;
  $('#fileStatus').style.display = 'block';
  $('#resultSection').style.display = 'none';
  $('#prog').innerHTML = '';
}

async function runAnalysis() {
  if (!S.file || S.isAnalyzing) return;
  const cfg = loadCfg();
  if (!cfg.apiKey) { alert('请先在右上角 Settings 中配置智谱 API Key！'); return; }

  S.isAnalyzing = true;
  const btn = $('#analyzeBtn');
  btn.disabled = true; btn.innerText = '处理中...';
  const prog = $('#prog');
  prog.innerHTML = `<div class="prog"><div class="msg">正在上传文件到智谱服务器...</div><div class="bar2"><i></i></div></div>`;

  try {
    const formData = new FormData();
    formData.append('file', S.file);

    const uploadRes = await fetch('https://open.bigmodel.cn/api/paas/v4/files', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + cfg.apiKey },
      body: formData
    });
    
    const uploadData = await uploadRes.json();
    if (!uploadData.id) throw new Error('上传失败: ' + JSON.stringify(uploadData));
    S.fileId = uploadData.id;
    
    prog.innerHTML = `<div class="prog"><div class="msg">文件上传成功 (ID: ${S.fileId})，AI 正在阅读并分析...</div><div class="bar2"><i></i></div></div>`;
    
    const chatRes = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({
        model: "glm-4-flash",
        messages: [{ role: "user", content: "请阅读我上传的文件，总结其核心内容，提取关键信息。请用 Markdown 格式排版输出。" }],
        file_ids: [S.fileId]
      })
    });
    
    const chatData = await chatRes.json();
    if (chatData.choices && chatData.choices.length > 0) {
      prog.innerHTML = `<div class="prog" style="background:var(--good-bg);color:var(--good)">分析完成！</div>`;
      $('#resultSection').style.display = 'block';
      $('#aiResult').innerHTML = chatData.choices[0].message.content;
    } else {
      throw new Error('AI 返回为空: ' + JSON.stringify(chatData));
    }
  } catch (error) {
    console.error(error);
    prog.innerHTML = `<div class="prog err">出错了: ${error.message}</div>`;
  } finally {
    S.isAnalyzing = false; btn.disabled = false; btn.innerText = '重新分析';
  }
}

function loadCfg() {
  try { return JSON.parse(localStorage.getItem('qs_cfg') || '{}'); } catch { return {}; }
}

function openSettings() {
  const c = loadCfg();
  $('#modal').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>AI 模型设置</h3>
      <div class="msub">你的 API Key 只保存在当前浏览器，不会上传到任何服务器。</div>
      <div class="field"><label>智谱 API Key</label>
        <input id="cfg-key" type="password" placeholder="输入你的智谱 API Key..." value="${c.apiKey || ''}">
      </div>
      <div class="foot2">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" onclick="saveSettings()">保存</button>
      </div>
    </div></div>`;
}

function saveSettings() {
  const key = $('#cfg-key').value.trim();
  if (!key) return alert('请输入 API Key');
  localStorage.setItem('qs_cfg', JSON.stringify({ apiKey: key }));
  closeModal(); alert('保存成功！');
}

function closeModal() { $('#modal').innerHTML = ''; }

function wireDragDrop() {
  const drop = $('#drop');
  if (!drop) return;
  ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }, false));
  ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }, false));
  drop.addEventListener('drop', e => { if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]); }, false);
}

function $(s) { return document.querySelector(s); }
renderHome();
</script>
</body>
</html>
